<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="参加人数とコート数を選ぶだけで、ピックルボールの対戦表を作れるアプリ">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ピックル乱数表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 左に設定、右に対戦表。試合カードは実寸比(44×20ft)のコート図で、サービスエリアに名前、キッチンにスコアを置く */
:root {
  --bg: #e7efed; --surface: #f8fbfa; --ink: #10303a; --muted: #4f6b73; --line: #c3d4d2;
  --court: #1d7486; --court-out: #2b8a66; --kitchen: #268ba0; --court-line: #ffffff; --on-court: #ffffff;
  --ball: #dde647; --on-ball: #26300a; --warn: #a64a12; --tint: #dbe8e5;
  --male-bg: #cfe3fb; --male-fg: #123a66; --female-bg: #fbd3e3; --female-fg: #6b1238;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --num: "Barlow Condensed", "Zen Kaku Gothic New", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1b1f; --surface: #15272c; --ink: #e4f0ed; --muted: #9ab3b6; --line: #2b444a;
  --court: #17606f; --court-out: #1d694e; --kitchen: #1e7385; --court-line: #e8f3f1; --on-court: #ffffff;
  --ball: #dde647; --on-ball: #26300a; --warn: #f2a671; --tint: #1e353b; color-scheme: dark;
  --male-bg: #24466e; --male-fg: #d6e7fb; --female-bg: #6a2a48; --female-fg: #fbdbe8;
} }
:root[data-theme="dark"] {
  --bg: #0d1b1f; --surface: #15272c; --ink: #e4f0ed; --muted: #9ab3b6; --line: #2b444a;
  --court: #17606f; --court-out: #1d694e; --kitchen: #1e7385; --court-line: #e8f3f1; --on-court: #ffffff;
  --ball: #dde647; --on-ball: #26300a; --warn: #f2a671; --tint: #1e353b; color-scheme: dark;
  --male-bg: #24466e; --male-fg: #d6e7fb; --female-bg: #6a2a48; --female-fg: #fbdbe8;
}
* { box-sizing: border-box; }
/* スマホのダブルタップ拡大を止める(2本指での拡大はそのまま使える) */
html { touch-action: manipulation; }
/* iPhoneは16px未満の入力欄を押すと自動で拡大するので、スマホ幅では16pxにそろえる */
@media (max-width: 480px) {
  input, select, textarea { font-size: 16px !important; }
  .members input[type="text"] { padding: 0 3px; }
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--court-out); outline-offset: 2px; }

.app { max-width: 1240px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.top svg { width: 38px; height: 38px; flex: none; }
.top h1 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 5vw, 30px); line-height: 1.2; margin: 0; }
.home { display: inline-flex; align-items: center; gap: 12px; }
#homeBtn, #shareBtn, #ownBtn, #backBtn { min-height: 40px; font-weight: 700; }
body.own #shareBtn { display: none; }
#sharebox:empty { display: none; }
.sharepanel { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.sharepanel h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; }
.sharepanel p, .sharepanel ol { margin: 0; }
.sharepanel ol { padding-left: 1.4em; }
.sharepanel .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.sharepanel .primary { width: auto; padding: 9px 14px; font-size: 15px; }
body.viewer #setup, body.viewer #homeBtn, body.viewer #shareBtn, body.viewer [data-act="addround"], body.viewer [data-act="link"] { display: none; }
body.viewer .layout, body.viewer.start .layout { grid-template-columns: minmax(0, 1fr); justify-content: stretch; }
body.viewer main, body.viewer.start main { display: grid; }
.kit input:disabled { opacity: 1; -webkit-text-fill-color: var(--ink); }
#homeBtn:disabled { opacity: .45; cursor: default; }
@media (max-width: 480px) {
  .top { gap: 8px; }
  .top svg { width: 30px; height: 30px; }
  .home { gap: 8px; }
  #homeBtn { padding: 6px 8px; font-size: 13px; }
}
.status { margin-left: auto; font-size: 13px; color: var(--muted); }
.layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

body.start .layout { grid-template-columns: minmax(0, 480px); justify-content: center; }
body.start main, body.start #setup > summary { display: none; }
body.start #side { padding-top: 16px; }
#flash { min-height: 1.5em; color: var(--warn); font-weight: 700; margin: 0; }
#flash:empty, #resetbox:empty { display: none; }

/* 設定 */
#setup { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
#setup summary { font-weight: 700; cursor: pointer; }
#setup > summary { padding: 12px 14px; }
#side { padding: 0 14px 14px; display: grid; gap: 14px; }
.field { display: grid; gap: 4px; }
.label { font-size: 13px; color: var(--muted); font-weight: 500; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 9px 4px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--court); color: var(--on-court); font-weight: 700; }
.seg button + button { border-left: 1px solid var(--line); }
.seg.four { gap: 1px; background: var(--line); }
.seg.four button { border-left: 0; font-size: 14px; }
.seg.four button:not([aria-pressed="true"]) { background: var(--surface); }
.main-steps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.main-steps .stepper { grid-template-columns: 38px 1fr 38px; }
.main-steps .stepper button { height: 56px; font-size: 22px; }
.main-steps .stepper b { font-size: 34px; }
.more { border-top: 1px solid var(--line); padding-top: 10px; }
.more summary { padding: 2px 0; font-size: 14px; }
.more > div { display: grid; gap: 12px; padding-top: 10px; }
.nums { display: grid; grid-template-columns: minmax(0, 160px); gap: 10px; }
.stepper { display: grid; grid-template-columns: 30px 1fr 30px; align-items: center; border: 1px solid var(--line); border-radius: 6px; }
.stepper button { border: 0; background: transparent; height: 40px; font-size: 18px; }
.stepper b, .stepper input { font-family: var(--num); font-weight: 700; font-size: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.stepper input { width: 100%; min-width: 0; height: 40px; border: 0; background: transparent; padding: 0; appearance: textfield; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
select { width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 0 6px; }
.plan { margin: 0; font-size: 13px; color: var(--muted); }
.plan strong { color: var(--ink); }
.lvnote { display: grid; gap: 2px; margin: 0; padding: 8px 10px; background: var(--tint); border-radius: 6px; font-size: 13px; }
.lvnote div { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 6px; }
.lvnote dt { font-family: var(--num); font-weight: 700; font-size: 15px; line-height: 1.4; }
.lvnote dd { margin: 0; }
.members { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 340px; overflow-y: auto; }
.members li { display: grid; grid-template-columns: 22px 20px minmax(0, 1fr) 54px 56px 24px; align-items: center; gap: 4px; }
.members select { height: 36px; padding: 0 2px; font-size: 13px; }
.members input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--court); margin: 0; }
.members .no { font-family: var(--num); color: var(--muted); text-align: right; font-size: 15px; }
.members input[type="text"] { width: 100%; min-width: 0; height: 36px; border: 1px solid transparent; border-bottom-color: var(--line); background: transparent; padding: 0 6px; }
.members input[type="text"]:focus { border: 1px solid var(--court); border-radius: 4px; }
.members li.off input[type="text"] { color: var(--muted); text-decoration: line-through; }
.members .del { border: 0; background: transparent; color: var(--muted); height: 36px; font-size: 16px; }
.add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.add textarea { width: 100%; min-width: 0; height: 42px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 8px; }
.add button, .ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 12px; font-weight: 500; }
.primary { border: 0; border-radius: 6px; background: var(--court); color: var(--on-court); font-weight: 700; padding: 12px; font-size: 16px; width: 100%; }
.confirm { display: grid; gap: 8px; border: 1px solid var(--warn); border-radius: 6px; padding: 10px; }
.confirm p { margin: 0; font-weight: 500; }
.confirm div { display: flex; gap: 8px; flex-wrap: wrap; }
.confirm .go { border: 0; background: var(--warn); color: var(--surface); border-radius: 6px; padding: 8px 12px; font-weight: 700; }
.linkbtn { border: 0; background: transparent; color: var(--muted); text-decoration: underline; padding: 2px 0; justify-self: start; font-size: 13px; }

/* タブ */
main { min-width: 0; display: grid; gap: 14px; }
.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 10px 16px; font-weight: 700; color: var(--muted); margin-bottom: -2px; border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--court-out); }
#panel { min-width: 0; display: grid; gap: 14px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 28px 20px; }
.empty h2 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 0 0 6px; }
.empty p { margin: 0; color: var(--muted); }

.stats { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; color: var(--muted); }
.stats b { font-family: var(--num); font-size: 19px; color: var(--ink); margin-left: 4px; font-variant-numeric: tabular-nums; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools select { width: auto; max-width: 100%; height: 38px; }
#copybox { width: 100%; height: 160px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 8px; }

/* 乱数表 */
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
tr:last-child > * { border-bottom: 0; }
thead th { font-size: 13px; color: var(--muted); font-weight: 500; white-space: nowrap; }
/* 列幅は面数に関係なく一定。3面でスマホ幅に収まる幅を上限つきで使う */
.drawwrap { container-type: inline-size; }
/* 1〜2面は画面幅を分け合って大きく表示し、3面以上は3面で画面幅に収まる幅にそろえる。文字もコート幅に合わせて大きくする */
table.draw { --round: 36px; --court: clamp(90px, calc((100cqw - var(--round)) / var(--d)), 400px); table-layout: fixed; width: calc(var(--round) + var(--n) * var(--court)); font-size: clamp(13px, calc(var(--court) * 0.11), 20px); }
.draw th, .draw td { width: var(--court); padding: .4em 2px; text-align: center; }
.draw th + th, .draw th + td, .draw td + td { border-left: 1px solid var(--line); }
.draw .r { position: sticky; left: 0; z-index: 1; background: var(--surface); padding: 2px; width: var(--round); }
.draw .r button { border: 0; background: transparent; width: 30px; height: 30px; padding: 0; border-radius: 50%; font-family: var(--num); font-weight: 700; font-size: 18px; }
.draw td.foldrow { width: auto; padding: 0; }
.foldrow button { width: 100%; min-height: 40px; border: 0; background: var(--tint); color: var(--muted); font-size: 13px; font-weight: 700; }
.draw td.done, .draw th.done { background: var(--tint); }
.draw td.done > *, .draw th.done button { opacity: .55; }
.draw tr.cur .r button { opacity: 1; }
.draw tr.cur .r button { background: var(--ball); color: var(--on-ball); }
.draw td.rest { width: auto; text-align: left; padding: 4px 6px; color: var(--muted); font-size: .92em; }
.draw .restlabel { margin-right: 6px; }
.p { white-space: nowrap; }
.g-m, .g-f { display: inline-block; padding: 0 4px; border-radius: 4px; line-height: 1.45; }
.g-m { background: var(--male-bg); color: var(--male-fg); }
.g-f { background: var(--female-bg); color: var(--female-fg); }
.m .p { display: block; width: fit-content; margin-block: 1px; }
.rest .p, .restband .p { display: inline-block; margin: 1px 8px 1px 0; }
.legend { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.side.win .g-m, .side.win .g-f { box-shadow: 0 0 0 2px var(--ball); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.stepbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; display: flex; gap: 8px; align-items: center; justify-content: space-between; background: var(--bg); padding-block: 6px; }
.stepbar .ghost { min-height: 44px; font-weight: 700; }
.stepbar .ghost:disabled { opacity: .4; cursor: default; }
.stepbar b { font-family: var(--num); font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ghost.wide { width: 100%; font-weight: 700; padding: 10px; }
.ghost[aria-pressed="true"] { background: var(--court); border-color: var(--court); color: var(--on-court); }
.m, .m .t { display: grid; justify-items: center; }
.m .mid { font-family: var(--num); font-size: 1.08em; line-height: 1.2; color: var(--muted); font-variant-numeric: tabular-nums; }
.m .mid.done { color: var(--ink); font-weight: 700; }
/* 番号表記は「チーム vs チーム」を1行に収める。入らない幅では vs を挟んで縦に積む */
.p.num { font-family: var(--num); font-size: 1.15em; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.3; }
.m .t.row { display: flex; gap: 1px; justify-content: center; }
.m .t.row .p { min-width: 1.28em; padding-inline: 2px; font-size: 1.08em; text-align: center; margin-block: 0; }
.m.compact { row-gap: 1px; }
.m .score { grid-column: 1 / -1; font-family: var(--num); font-size: 1.08em; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
@container (min-width: 322px) {
  .m.compact { grid-template-columns: 1fr auto 1fr; column-gap: 3px; align-items: center; }
  .m.compact .t:first-child { justify-self: end; }
  .m.compact .mid + .t { justify-self: start; }
}
.rest .p.num { min-width: 22px; margin: 0 2px; text-align: center; line-height: 1.2; }
.m .t.w { font-weight: 700; }
mark { background: var(--ball); color: var(--on-ball); border-radius: 3px; padding: 0 3px; }

/* 回の切替 */
.rounds { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rounds button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 18px; }
.rounds button:disabled { opacity: .4; cursor: default; }
.rounds select { width: auto; min-width: 130px; height: 44px; font-weight: 700; }
.rounds .plus { width: auto; border-radius: 22px; padding: 0 14px; font-size: 14px; font-weight: 500; }

/* コート図 */
.courts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 350px), 1fr)); gap: 14px; }
.court { display: grid; gap: 4px; min-width: 0; }
.court header { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.court h3 { margin: 0; font-size: 14px; font-weight: 700; }
.surround { background: var(--court-out); padding: 9px; border-radius: 6px; container-type: inline-size; }
.play { display: grid; grid-template-columns: 15fr 7fr 7fr 15fr; aspect-ratio: 44 / 20; min-height: 136px; max-width: 100%; background: var(--court); border: 2px solid var(--court-line); color: var(--on-court); }
.side { display: grid; grid-auto-rows: 1fr; min-width: 0; position: relative; }
.svc { display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px 0; font-weight: 500; font-size: clamp(12px, 4.5cqw, 17px); line-height: 1.25; min-width: 0; white-space: nowrap; }
.side .svc + .svc { border-top: 2px solid var(--court-line); }
.side.solo::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid var(--court-line); opacity: .35; }
.side.solo .svc { position: relative; z-index: 1; }
.side.win .svc { font-weight: 700; color: var(--ball); }
.kit { background: var(--kitchen); display: flex; align-items: center; justify-content: center; min-width: 0; padding: 2px; }
.kit.l { border-left: 2px solid var(--court-line); border-right: 2px dashed var(--court-line); }
.kit.r { border-right: 2px solid var(--court-line); }
.kit input { width: 100%; max-width: 46px; height: 46px; border: 0; border-radius: 4px; background: var(--surface); color: var(--ink); text-align: center; font-family: var(--num); font-weight: 700; font-size: 24px; padding: 0; appearance: textfield; -moz-appearance: textfield; }
.kit input::-webkit-outer-spin-button, .kit input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.restband { background: var(--tint); border-radius: 6px; padding: 8px 12px; }
.restband .label { margin-right: 8px; }

/* 順位 */
.rank td, .rank th { white-space: nowrap; font-variant-numeric: tabular-nums; }
.rank td { font-family: var(--num); font-size: 18px; }
.rank td.name { font-family: var(--body); font-size: 15px; font-weight: 500; }
.rank th.n, .rank td.n { text-align: right; }
.rank tr.first .place { background: var(--ball); color: var(--on-ball); border-radius: 50%; display: inline-block; width: 26px; text-align: center; }
.foot { color: var(--muted); font-size: 13px; margin: 0; }
</style>

<div class="app">
  <div class="top">
    <h1 class="home"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--ball)"/><g fill="var(--court)"><circle cx="20" cy="9" r="2.4"/><circle cx="20" cy="31" r="2.4"/><circle cx="9" cy="20" r="2.4"/><circle cx="31" cy="20" r="2.4"/><circle cx="12" cy="12" r="2.4"/><circle cx="28" cy="12" r="2.4"/><circle cx="12" cy="28" r="2.4"/><circle cx="28" cy="28" r="2.4"/><circle cx="20" cy="20" r="2.4"/></g></svg>ピックル乱数表</h1>
    <button type="button" class="ghost" id="homeBtn" data-act="reset">最初の画面に戻る</button>
    <button type="button" class="ghost" id="shareBtn" data-act="share">共有</button>
    <button type="button" class="ghost" id="ownBtn" data-act="own" hidden>自分用に作る</button>
    <button type="button" class="ghost" id="backBtn" data-act="back" hidden>共有の対戦表に戻る</button>
    <span class="status" id="status" role="status"></span>
  </div>
  <div id="resetbox"></div>
  <div id="sharebox"></div>
  <p id="flash" aria-live="polite"></p>
  <div class="layout">
    <details id="setup" open>
      <summary id="sum">メンバーと設定</summary>
      <div id="side"></div>
    </details>
    <main>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="panel" role="tabpanel"></div>
    </main>
  </div>
</div>

<script>
/*ENGINE*/
function courtName(c) { return String.fromCharCode(65 + c) + "コート"; }
function pairKey(x, y) { return x < y ? x + "|" + y : y + "|" + x; }

function newStats(history, cfg) {
  const s = { cfg, partner: new Map(), opp: new Map(), played: new Map(), lastRest: new Map(), lastPair: new Map(), round: history.length };
  history.forEach((rd, r) => commitRound(s, rd, r));
  return s;
}
function bump(map, k) { map.set(k, (map.get(k) || 0) + 1); }
function commitRound(s, rd, r) {
  for (const m of rd.matches) {
    for (const team of [m.a, m.b]) {
      team.forEach(id => bump(s.played, id));
      if (team.length === 2) { const k = pairKey(team[0], team[1]); bump(s.partner, k); s.lastPair.set(k, r); }
    }
    for (const x of m.a) for (const y of m.b) { const k = pairKey(x, y); bump(s.opp, k); s.lastPair.set(k, r); }
  }

  const used = new Set(state.schedule.flatMap(r => r.rest.concat(r.matches.flatMap(m => m.a.concat(m.b)))));
  return {
    v: 1, t: Date.now(), f: state.format, c: state.cur,
    p: state.players.filter(p => used.has(p.id)).map(p => [noOf(p.id), p.name || "", p.gender || "", p.level || 0]),
    s: state.schedule.map(r => [r.matches.map(m => [m.a.map(noOf), m.b.map(noOf), m.sa, m.sb]), r.rest.map(noOf)]),
  };
}
// リンクの中身は誰でも書き換えられるので、形と範囲を確かめてから使う
function unpackState(d) {
  const num = (x, lo, hi) => Number.isInteger(x) && x >= lo && x <= hi;
  const score = x => x === null || num(x, 0, 99);
  if (!d || d.v !== 1 || !Array.isArray(d.p) || !Array.isArray(d.s) || d.p.length > 60 || d.s.length > MAX_ROUNDS || !d.s.length) throw new Error("shape");
  const st = makeDefault();
  st.players = d.p.map(x => {
    if (!Array.isArray(x) || !num(x[0], 1, 999)) throw new Error("player");
    return { id: "p" + x[0], name: clip(String(x[1] || "")), gender: ["m", "f"].includes(x[2]) ? x[2] : "", level: num(x[3], 0, 5) ? x[3] : 0, active: true };
  });
  const known = new Set(st.players.map(p => p.id));
  const ids = list => {
    if (!Array.isArray(list)) throw new Error("ids");
    return list.map(n => { const id = "p" + n; if (!known.has(id)) throw new Error("id"); return id; });
  };
  st.schedule = d.s.map(r => {
    if (!Array.isArray(r) || !Array.isArray(r[0]) || r[0].length > 12) throw new Error("round");
    return {
      matches: r[0].map(m => {
        if (!Array.isArray(m) || !score(m[2]) || !score(m[3])) throw new Error("match");
        return { a: ids(m[0]), b: ids(m[1]), sa: m[2], sb: m[3] };
      }),
      rest: ids(r[1]),
    };
  });
  st.format = d.f === "s" ? "s" : "d";
  st.courts = Math.max(1, ...st.schedule.map(r => r.matches.length));
  st.rounds = st.schedule.length;
  st.players.sort((x, y) => noOf(x.id) - noOf(y.id));
  st.cur = num(d.c, 0, st.schedule.length - 1) ? d.c : 0;
  st.sig = sigOf(st);
  linkTime = num(d.t, 0, 9e15) ? d.t : 0;
  return st;
}

/* 操作 */
function cfgOf() {
  const pick = key => new Map(state.players.map(p => [p.id, p[key]]));
  return { mode: state.format === "d" ? state.mix : "none", gender: pick("gender"), level: pick("level"), levelOn: !!state.levelOn, one: levelOneGroup() };
}
function levelOneGroup() {
  if (!state.levelOn || !state.levelOne) return null;
  const low = state.players.filter(p => p.active && p.level === 1).map(p => p.id);
  return low.length >= size() && activeIds().length - low.length >= size() ? new Set(low) : null;
}
function cannotBuild() {
  const ids = activeIds(), cfg = cfgOf();
  if (usableCourts(ids, state.courts, size(), cfg)) return false;
  flash(cfg.mode === "only" && ids.length >= 4 ? "ミックスのみは男女2人ずつ以上で組めます。性別を確認してください。" : `あと${size() - ids.length}人いると組めます。`);
  return true;
}
function generateAll() {
  const ids = activeIds();
  if (cannotBuild()) return;
  state.schedule = makeRounds([], ids, state.courts, size(), state.rounds, 400, cfgOf());
  state.cur = 0; state.sig = sigOf(state); ui.confirm = null; flash("");
  touch(); renderAll(); pruneScores();
}
function regenerateFrom(r) {
  const ids = activeIds();
  if (cannotBuild()) return;
  const hist = state.schedule.slice(0, r);
  state.schedule = hist.concat(makeRounds(hist, ids, state.courts, size(), state.schedule.length - r, 400, cfgOf()));
  state.sig = sigOf(state); ui.confirm = null;
  flash(""); touch(); renderAll(); pruneScores();
  setStatus(`第${r + 1}回から組み直しました`);
}
function addRound() {
  const ids = activeIds();
  if (cannotBuild()) return;
  state.schedule = state.schedule.concat(makeRounds(state.schedule, ids, state.courts, size(), 1, 200, cfgOf()));
  state.rounds = state.schedule.length; state.sig = sigOf(state);
  flash(""); touch(); renderAll();
  setStatus(`第${state.rounds}回を追加しました`);
}
function addPlayer(name) {
  let n = 1;
  while (state.players.some(p => noOf(p.id) === n)) n++;
  state.players.push({ id: "p" + n, name, active: true, gender: "", level: 0 });
  state.players.sort((x, y) => noOf(x.id) - noOf(y.id));
}
function changeCount(d) {
  const active = state.players.filter(p => p.active);
  if (active.length + d < 2 && d < 0 || active.length + d > 60) return;
  if (d > 0) {
    const back = state.players.find(p => !p.active);
    if (back) back.active = true; else addPlayer("");
  } else {
    const last = active[active.length - 1];
    if (inSchedule(last.id)) last.active = false;
    else state.players = state.players.filter(p => p !== last);
  }
  touch(); renderSide();
}
function addPlayers(text) {
  const names = text.split(/[\n,、]+/).map(s => s.trim()).filter(Boolean);
  for (const name of names) {
    const open = state.players.find(p => p.active && !p.name.trim());
    if (open) open.name = clip(name); else addPlayer(clip(name));
  }
  flash(names.some(s => [...s].length > MAX_NAME) ? `名前は${MAX_NAME}文字までなので、長い名前は${MAX_NAME}文字に切り詰めました。` : "");
  if (names.length) { touch(); renderSide(); renderPanel(); }
}
function copyText() {
  return state.schedule.map((r, i) => {
    const lines = [`第${i + 1}回`];
    r.matches.forEach((m, c) => {
      const sc = m.sa != null && m.sb != null ? ` (${m.sa}-${m.sb})` : "";
      lines.push(`${courtName(c)}: ${teamText(m.a)} vs ${teamText(m.b)}${sc}`);
    });
    if (r.rest.length) lines.push(`休み: ${restInOrder(r).map(nameOf).join("、")}`);
    return lines.join("\n");
  }).join("\n\n");
}
// 引き分けは0.5勝として勝率に入れる
const rate = x => x.g ? (x.w + x.d / 2) / x.g : 0;
function standings() {
  const rows = new Map(state.players.map(p => [p.id, { id: p.id, name: nameOf(p.id), planned: 0, g: 0, w: 0, l: 0, d: 0, diff: 0, pf: 0, rest: 0 }]));
  for (const r of state.schedule) {
    r.rest.forEach(id => { const x = rows.get(id); if (x) x.rest++; });
    for (const m of r.matches) {
      [[m.a, m.sa, m.sb], [m.b, m.sb, m.sa]].forEach(([team, own, other]) => team.forEach(id => {
        const x = rows.get(id);
        if (!x) return;
        x.planned++;
        if (!scored(m)) return;
        x.g++; x.pf += own; x.diff += own - other;
        if (own > other) x.w++; else if (own < other) x.l++; else x.d++;
      }));
    }
  }
  return [...rows.values()].filter(x => x.planned || x.rest)
    .sort((x, y) => rate(y) - rate(x) || y.diff - x.diff || y.pf - x.pf || y.g - x.g);
}

}
const isNumberOnly = id => { const p = state.players.find(x => x.id === id); return !p || !clip(p.name); };
const restInOrder = r => r.rest.slice().sort((x, y) => noOf(x) - noOf(y));
function highlight(id) { const t = esc(nameOf(id)); return `<span class="p${genderClass(id)}${isNumberOnly(id) ? " num" : ""}">${id === ui.who ? `<mark>${t}</mark>` : t}</span>`; }
function teamCell(team, win) {
  return `<span class="t${win ? " w" : ""}${team.every(isNumberOnly) ? " row" : ""}">${team.map(highlight).join("")}</span>`;
}
function matchCell(m) {
  const d = scored(m), compact = m.a.concat(m.b).every(isNumberOnly);
  const score = `${m.sa}–${m.sb}`;
  const mid = d && !compact ? `<span class="mid done">${score}</span>` : '<span class="mid">vs</span>';
  return `<div class="m${compact ? " compact" : ""}">${teamCell(m.a, d && m.sa > m.sb)}${mid}${teamCell(m.b, d && m.sb > m.sa)}${d && compact ? `<span class="score">${score}</span>` : ""}</div>`;
}
function legend() {
  return state.players.some(p => p.gender) ? '<span class="legend"><span class="g-m">男性</span><span class="g-f">女性</span></span>' : "";
}
function stepBar() {
  const i = state.cur, last = state.schedule.length - 1;
  return `<div class="stepbar">
    <button type="button" class="ghost" id="stepPrev" data-cur="${i - 1}"${i === 0 ? " disabled" : ""}>‹ 前の試合</button>
    <b>第${i + 1}回 / ${last + 1}</b>
    <button type="button" class="ghost" id="stepNext" data-cur="${i + 1}"${i === last ? " disabled" : ""}>次の試合 ›</button>
  </div>`;
}
function renderDraw() {
  const f = fairness(state.schedule, [...new Set(state.schedule.flatMap(r => r.rest.concat(r.matches.flatMap(m => m.a.concat(m.b)))))]);
  const courts = Math.max(...state.schedule.map(r => r.matches.length));
  // 主催者が進めた回より前を済みとして薄暗くする
  const reached = readOnly && remoteCur != null ? remoteCur : state.cur;
  const range = ([a, b]) => a === b ? `${a}` : `${a}〜${b}`;
  $("panel").innerHTML = `
    ${stepBar()}
    <div class="stats">
      ${legend()}
      ${state.format === "d" ? `<span>同じペアは最大<b>${f.maxPartner}</b> 回</span>` : ""}
      <span>同じ相手は最大<b>${f.maxOpp}</b> 回</span>
      <span>1人の試合数<b>${range(f.games)}</b></span>
      <span>1人の休み<b>${range(f.rests)}</b> 回</span>
    </div>
    <div class="tools">
      <select id="who" aria-label="探す人を選ぶ"><option value="">自分の試合を探す</option>${state.players.map(p => `<option value="${esc(p.id)}"${ui.who === p.id ? " selected" : ""}>${esc(nameOf(p.id))}</option>`).join("")}</select>
      ${inClaude ? "" : '<button type="button" class="ghost" data-act="link">共有リンクを作る</button>'}
      <button type="button" class="ghost" data-act="copy">テキストをコピー</button>
      <button type="button" class="ghost" data-act="addround">試合を追加</button>
    </div>
    <div id="copyslot"></div>
    <div class="tablewrap drawwrap"><table class="draw" style="--n: ${courts}; --d: ${Math.min(courts, 3)}">
      <thead><tr><th class="r">回</th>${Array.from({ length: courts }, (_, c) => `<th>${courtName(c)}</th>`).join("")}</tr></thead>
      <tbody>${reached ? `<tr><td class="foldrow" colspan="${courts + 1}"><button type="button" data-act="fold" aria-expanded="${!!ui.showDone}">${ui.showDone ? "済んだ試合を畳む" : `済んだ試合を表示(${reached}回分)`}</button></td></tr>` : ""}${state.schedule.map((r, i) => i < reached && !ui.showDone && i !== state.cur ? "" : `<tr class="${i === state.cur ? "cur" : ""}">
        <th class="r${i < reached ? " done" : ""}" scope="row"${r.rest.length ? ' rowspan="2"' : ""}><button type="button" data-open="${i}" aria-label="第${i + 1}回のコートを開く">${i + 1}</button></th>
        ${Array.from({ length: courts }, (_, c) => `<td${i < reached ? ' class="done"' : ""}>${r.matches[c] ? matchCell(r.matches[c]) : ""}</td>`).join("")}
      </tr>${r.rest.length ? `<tr><td class="rest${i < reached ? " done" : ""}" colspan="${courts}"><span class="restlabel">休み</span>${restInOrder(r).map(highlight).join("")}</td></tr>` : ""}`).join("")}</tbody>
    </table></div>`;
}
function sideHtml(team, win) {
  return `<div class="side${team.length === 1 ? " solo" : ""}${win ? " win" : ""}">${team.map(id => `<div class="svc"><span class="p${genderClass(id)}">${esc(nameOf(id))}</span></div>`).join("")}</div>`;
}
function roundPicker() {
  const i = state.cur, last = state.schedule.length - 1;
  return `<button type="button" data-cur="${i - 1}" aria-label="前の回"${i === 0 ? " disabled" : ""}>‹</button>
    <select id="roundsel" aria-label="回を選ぶ">${state.schedule.map((r, k) => `<option value="${k}"${k === i ? " selected" : ""}>第${k + 1}回 / ${last + 1}${roundDone(r) ? " 済" : ""}</option>`).join("")}</select>
    <button type="button" data-cur="${i + 1}" aria-label="次の回"${i === last ? " disabled" : ""}>›</button>`;
}
function renderCourt() {
  const i = state.cur, r = state.schedule[i], lock = ui.preview || scoreLocked ? " disabled" : "";
  $("panel").innerHTML = `
    <div class="rounds" id="rounds">${roundPicker()}<button type="button" class="plus" data-act="addround">試合を追加</button>${legend()}</div>
    <div class="courts">${r.matches.map((m, c) => `<article class="court" data-m="${c}">
      <header><h3>第${i + 1}回 ${courtName(c)}</h3></header>
      <div class="surround"><div class="play">
        ${sideHtml(m.a, scored(m) && m.sa > m.sb)}
        <div class="kit l"><input id="s-${i}-${c}-a" data-score="sa" type="number" inputmode="numeric" min="0" max="99" value="${m.sa ?? ""}"${lock} aria-label="${courtName(c)} ${esc(teamText(m.a))}の得点"></div>
        <div class="kit r"><input id="s-${i}-${c}-b" data-score="sb" type="number" inputmode="numeric" min="0" max="99" value="${m.sb ?? ""}"${lock} aria-label="${courtName(c)} ${esc(teamText(m.b))}の得点"></div>
        ${sideHtml(m.b, scored(m) && m.sb > m.sa)}
      </div></div>
    </article>`).join("")}</div>
    ${r.rest.length ? `<div class="restband"><span class="label">休み</span>${restInOrder(r).map(highlight).join("")}</div>` : ""}`;
}
function renderRank() {
  const rows = standings(), any = rows.some(x => x.g), draws = rows.some(x => x.d);
  $("panel").innerHTML = `
    <div class="tablewrap"><table class="rank">
      <thead><tr><th>順位</th><th>名前</th><th class="n">勝</th><th class="n">敗</th>${draws ? '<th class="n">分</th>' : ""}<th class="n">勝率</th><th class="n">得失点</th><th class="n">試合</th><th class="n">休み</th></tr></thead>
      <tbody>${rows.map((x, i) => `<tr class="${any && i === 0 ? "first" : ""}">
        <td><span class="place">${any ? i + 1 : "–"}</span></td><td class="name">${highlight(x.id)}</td>
        <td class="n">${x.w}</td><td class="n">${x.l}</td>${draws ? `<td class="n">${x.d}</td>` : ""}<td class="n">${x.g ? rate(x).toFixed(3).replace(/^0/, "") : "–"}</td>
        <td class="n">${x.diff > 0 ? "+" : ""}${x.diff}</td><td class="n">${x.g}/${x.planned}</td><td class="n">${x.rest}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    <p class="foot">${any ? `勝率、得失点、総得点の順に並べています。${draws ? "引き分けは0.5勝として数えます。" : ""}ダブルスは個人ごとの成績です。` : "コートタブでスコアを入れると順位が出ます。"}</p>`;
}

/* イベント */
document.addEventListener("click", e => {
  if (e.target.closest('[data-act="local"]')) { useOwnCopy(); return; }
  if (!state) return;
  const b = e.target.closest("button");
  if (!b) return;
  const d = b.dataset;
  if (d.tab) {
    ui.tab = d.tab; ui.confirm = null; saveUi();
    renderTabs(); renderPanel(); renderSide();
    return;
  }
  if (d.open != null) { state.cur = +d.open; ui.tab = "court"; saveUi(); touch(); renderTabs(); renderPanel(); renderSide(); return; }
  if (d.cur != null) {
    // 回を進めても画面の位置は動かさない
    const y = window.scrollY;
    state.cur = +d.cur; ui.confirm = null; touch(); renderPanel(); renderSide();
    if (b.id && $(b.id)) $(b.id).focus({ preventScroll: true });
    window.scrollTo(0, y);
    return;
  }
  if (d.format) { state.format = d.format; touch(); renderSide(); return; }
  if (d.mix) { state.mix = state.mix === d.mix ? "none" : d.mix; touch(); renderSide(); return; }
  if (d.levelmode) {
    state.levelOn = d.levelmode === "on";
    if (!state.levelOn) state.levelOne = false;
    touch(); renderSide(); return;
  }
  if (d.levelone) { state.levelOne = !state.levelOne; touch(); renderSide(); return; }
  if (d.step === "players") { changeCount(+d.d); return; }
  if (d.step) {
    const lim = d.step === "courts" ? [1, 12] : [1, MAX_ROUNDS];
    state[d.step] = Math.min(lim[1], Math.max(lim[0], state[d.step] + +d.d));
    touch(); renderSide(); return;
  }
  if (d.del) { state.players = state.players.filter(p => p.id !== d.del); touch(); renderSide(); return; }
  const act = d.act;
  if (act === "add") { addPlayers($("newname").value); $("newname").focus(); }
  if (act === "all") { if (hasScores()) { ui.confirm = "all"; renderSide(); } else generateAll(); }
  if (act === "all-go") generateAll();
  if (act === "link") shareLink();
  if (act === "link-save") { ui.confirm = "linksave"; renderShare(); }
  if (act === "link-save-go") {
    const own = JSON.parse(JSON.stringify(state));
    own.rev = Math.random().toString(36).slice(2);
    lsSet("pb-state", own);
    location.replace(location.pathname);
  }
  if (act === "link-close") location.replace(location.pathname);
  if (act === "own") useOwnCopy();
  if (act === "back") location.reload();
  if (act === "fold") { ui.showDone = !ui.showDone; renderPanel(); }
  if (act === "share") { ui.share = !ui.share; renderShare(); }
  if (act === "share-preview") { ui.preview = true; ui.share = false; renderAll(); }
  if (act === "share-exit") { ui.preview = false; setStatus(""); renderAll(); }
  if (act === "reset") { ui.confirm = "reset"; renderSide(); }
  if (act === "reset-go") {
    state = makeDefault();
    Object.assign(ui, { confirm: null, who: "", moreOpen: false, namesOpen: false });
    saveUi(); flash(""); touch(); renderAll(); pruneScores();
  }
  if (act === "names") { ui.confirm = "names"; renderSide(); }
  if (act === "names-go") { state.players.forEach(p => { p.name = ""; }); ui.confirm = null; touch(); renderSide(); renderPanel(); }
  if (act === "cancel") { ui.confirm = null; renderSide(); renderPanel(); renderShare(); }
  if (act === "addround") addRound();
  if (act === "from") {
    if (state.schedule.slice(state.cur).some(x => x.matches.some(m => m.sa != null || m.sb != null))) { ui.confirm = "from"; renderSide(); }
    else regenerateFrom(state.cur);
  }
  if (act === "from-go") regenerateFrom(state.cur);
  if (act === "copy") {
    const text = copyText();
    const show = () => { $("copyslot").innerHTML = '<textarea id="copybox" aria-label="コピー用テキスト" readonly></textarea>'; $("copybox").value = text; $("copybox").select(); flash("自動でコピーできませんでした。選択中のテキストをコピーしてください。"); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => { flash(""); setStatus("テキストをコピーしました"); }, show);
    else show();
  }
});
document.addEventListener("input", e => {
  if (!state) return;
  const t = e.target, d = t.dataset;
  if (d.name) {
    const p = state.players.find(x => x.id === d.name);
    if (p) { p.name = t.value; touch(); renderPanel(); updateHomeBtn(); }
  } else if (d.score) {
    const m = state.schedule[state.cur].matches[+t.closest(".court").dataset.m];
    const n = parseInt(t.value, 10);
    m[d.score] = Number.isNaN(n) ? null : Math.max(0, Math.min(99, n));
    const card = t.closest(".court"), sides = card.querySelectorAll(".side");
    sides[0].classList.toggle("win", scored(m) && m.sa > m.sb);
    sides[1].classList.toggle("win", scored(m) && m.sb > m.sa);
    const opt = $("roundsel").options[state.cur];
    opt.textContent = `第${state.cur + 1}回 / ${state.schedule.length}${roundDone(state.schedule[state.cur]) ? " 済" : ""}`;
    saveScore(state.cur, +card.dataset.m);
  }
});
document.addEventListener("change", e => {
  if (!state) return;
  const t = e.target;
  if (t.id === "roundsInput") {
    const n = parseInt(t.value, 10);
    state.rounds = Number.isNaN(n) ? state.rounds : Math.min(MAX_ROUNDS, Math.max(1, n));
    touch(); renderSide();
  }
  if (t.id === "roundsel") { state.cur = +t.value; ui.confirm = null; touch(); renderPanel(); renderSide(); }
  if (t.dataset.gender || t.dataset.level) {
    const p = state.players.find(x => x.id === (t.dataset.gender || t.dataset.level));
    if (p) {
      if (t.dataset.gender) p.gender = t.value; else p.level = +t.value;
      touch(); renderSide(true);
    }
  }
  if (t.dataset.on) {
    const p = state.players.find(x => x.id === t.dataset.on);
    if (p) { p.active = t.checked; touch(); renderSide(); }
  }
  if (t.id === "who") { ui.who = t.value; saveUi(); renderPanel(); }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "newname" && e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    addPlayers(e.target.value);
    const box = $("newname");
    if (box) box.focus();
  }
});

// 開いたまま別の共有リンクを開いたときは読み直す
window.addEventListener("hashchange", () => { if (!inClaude && location.hash.startsWith("#s=")) location.reload(); });
document.addEventListener("toggle", e => {
  if (e.target.dataset && e.target.dataset.open) ui[e.target.dataset.open] = e.target.open;
}, true);

connect();
</script>

</html>
